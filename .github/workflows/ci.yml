name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go vet ./...
      - uses: dominikh/staticcheck-action@v1
        with:
          version: latest
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - run: go test -v ./...
