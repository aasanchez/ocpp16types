name: Weekly

on:
  schedule:
    - cron: "0 5 * * 0" # 05:00 UTC weekly (Sunday)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Race + Fuzz + Bench + Test-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Clean caches
        run: go clean -cache -testcache -modcache

      - name: Run full test-all
        run: make test-all

      - name: Run race detector (opt-in)
        run: make test-race

      - name: Run fuzzers (short)
        run: FUZZPROCS=4 make test-fuzz

      - name: Run benchmarks (smoke)
        run: make test-bench

      - name: Upload reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-artifacts-${{ github.run_number }}
          path: reports/**
          if-no-files-found: ignore
