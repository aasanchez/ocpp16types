version: "2"

linters:
  enable:
    - errcheck
    - gocritic
    - gofmt
    - goimports
    - gosimple
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: false
      - name: var-naming
        arguments:
          - allowList:
              - "Id"

formatters:
  enable:
    - gofmt
    - goimports
